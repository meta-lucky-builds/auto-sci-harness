[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-harness"
version = "0.0.1"
description = "Self-improving autonomous research harness with verifier-tier-gated autonomy"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
chh = "custom_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
custom_harness = ["gateway/providers.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
