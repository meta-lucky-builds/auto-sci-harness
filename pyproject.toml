[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "custom-harness"
version = "0.0.1"
description = "Self-improving autonomous research harness with verifier-tier-gated autonomy"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.7",
    "httpx>=0.27",
    "pyyaml>=6",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100"]

[project.scripts]
chh = "custom_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
custom_harness = ["gateway/providers.yaml", "scorecard/benchmarks.yaml", "scorecard/capabilities.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "BLE", "S110", "PLW1510"]
# RUF001-3: unicode punctuation in prose (en dashes, arrows) is intentional; RUF005: style only
ignore = ["RUF001", "RUF002", "RUF003", "RUF005"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLW1510", "BLE001", "B011"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = true
strict = false
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_any_generics = false

# The Evidence Kernel is checked with `mypy --strict src/custom_harness/kernel` (see tests/test_quality.py).

[tool.coverage.run]
branch = true
source = ["custom_harness"]
