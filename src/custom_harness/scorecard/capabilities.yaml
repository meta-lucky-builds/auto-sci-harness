# Claimed capabilities (GOAL §9 coverage contract, transcribed row by row) and the ablation switch of each
# (GOAL §2.1, invariant 12: every claimed capability has code, a test and an ablation).
# `ablation: null` = no switch that turns the capability off exists yet. The scorecard reports every such row as an
# invariant-12 gap; it never drops a row. Set `ablation` to the name of a switch the system under test understands
# (passed to System.run as `disabled`) once one is wired, then record an ablation run (`scorecard.runner.run_ablation`).
