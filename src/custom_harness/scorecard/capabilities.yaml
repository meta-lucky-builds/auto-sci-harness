      deterministic gate: 'the held-out gate (evolve/selection.py gate, evolve/loop.py _lofo) is an integrity mechanism (invariants 6, 16): no switch'
      per-task attribution: 'evolve/loop.py _per_task reaches the proposer through its PAST EDITS ledger (evolve/export.py proposer_view: per_task, flipped, regressed restricted to evolve tasks); the ledger as a whole is switched by `proposer-history` (row meta-harness); per-task attribution alone is not switched'
