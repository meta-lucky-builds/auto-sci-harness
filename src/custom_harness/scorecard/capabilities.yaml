# Claimed capabilities (GOAL §9 coverage contract, transcribed row by row) and the ablation record of each
# (GOAL §2.1, invariant 12: every claimed capability has code, a test and an ablation). docs/ablation.md is the table.
# `ablation` is exactly one of:
#   {switch: NAME}                       a real switch in the closed registry custom_harness.ablation.SWITCHES (with
#                                        its code path and its test); `not_covered: {part: reason}` lists any part of
#                                        the row the switch does NOT turn off (then the row is a partial switch: a gap)
#   {not_ablatable: "exact reason"}      no switch: not built, or an integrity mechanism (never switched off in
#                                        production; measured only inside the evaluation harness)
# The scorecard counts a row as switched only for a full, registered, tested switch, and as ablated only once an
# ablation run (`scorecard.runner.run_ablation`) is recorded and compared; every other row is an invariant-12 gap.
capabilities:
- id: meta-harness
  source: Meta-Harness
  capability: Proposer with full history filesystem
  home: L6.1–2
  ablation:
    switch: proposer-history
- id: rhi
  source: RHI
  capability: Contracts and hops as edit types; compare to parent
  home: L6 edit types, race
  ablation:
    switch: contract-hop-edits
    not_covered:
      compare to parent: 'the paired comparison against the parent (evolve/selection.py race / paired_sample / gate) is the acceptance statistic, an integrity mechanism (invariant 6): no switch'
- id: rrsi
  source: RRSI
  capability: Leakage critic, regularised proposals/acceptance, cost-aware admission
  home: L6.5, L6.8, L6.10
  ablation:
    switch: cost-term
    not_covered:
      leakage critic: 'the model critic (evolve/critic.py) needs a second model family (invariant 5 NOT MET) and is advisory, recorded only (evolve/loop.py), never gating; the deterministic leakage screens (evolve/edits.py screen_prediction / denied_tokens, evolve/export.py screen_digest) are integrity mechanisms: no switch'
      regularised proposals: 'the annealed operator budget (evolve/generations.py AnnealSchedule) is applied in evolve/driver.py (CampaignLedger.begin), only when a campaign is declared, and the driver receives no AblationSet: not switched'
      regularised acceptance: 'the regularised acceptance is the leave-one-family/domain-out non-regression gate (evolve/loop.py _lofo), an integrity gate (invariant 16): no switch'
- id: self-harness
  source: Self-Harness
  capability: Causal failure signatures, held-in/out non-regression, decline path
  home: L6.3, L6.6, gate
  ablation:
    switch: causal-signatures
    not_covered:
      held-in/out non-regression: 'the held-out gate and the leave-one-family/domain-out non-regression (evolve/selection.py gate, evolve/loop.py _lofo) are integrity gates (invariants 6, 16): no switch'
      decline path: offered in the proposer prompt and schema (evolve/propose.py) and recorded as a `declined` lineage status (evolve/loop.py); not switched (this row's switch is causal-signatures, one switch per row)
- id: autosaddler
  source: AutoSaddler
  capability: Deep diagnosis, patch taxonomy, mini-batch pre-filter, composition DAG
  home: L6.3, edit types, L6.8
  ablation:
    switch: minibatch-prefilter
    not_covered:
      deep diagnosis: its first-divergence part is switched by `causal-signatures` (row self-harness, one switch per row); the failure clusters with trace excerpts (evolve/propose.py diagnose) are not switched
      patch taxonomy: 'the typed edit taxonomy (evolve/edits.py EditType) is the only form an edit can take; removing it removes evolution itself, not one capability of it: no switch'
      composition DAG: not built (no edit composition exists in evolve/)
- id: milo
  source: MILO
  capability: Islands, lineage with rejects, adaptive orchestrator
  home: L7, ledger
  ablation:
    switch: orchestrator-reallocation
    not_covered:
      islands: 'the island population runs only in the opt-in campaign mode `chh evolve --islands` (evolve/search.py evolve_islands); the default `chh evolve` is single-population. An ablated arm never accepts, so its islands all stall after the window and never see a gated rejection: the switch then changes only the stall decisions'' budget and mutator mix; a single-population arm is not built'
      lineage with rejects: the novelty gate's input (switched by `novelty-gate`, row harnessx) and part of the proposer's evidence export (evolve/export.py lineage.json, removed with the whole export by `proposer-history`, row meta-harness); not separately switched
      'adaptive orchestrator: lever choice and edit-type quota': the lever choice is switched by `lever-choice` (row sia); the prompt-only edit-type quota (Orchestrator.step cap, admit) is not switched
- id: mixture-of-branches
  source: Mixture of Branches
  capability: Coverage-based branching, router
  home: L6.9
  ablation:
    not_ablatable: 'branching: branch creation (evolve/branches.propose_branch) never happens in ANY ablated generation (evolve/loop.py: an ablated arm records no rejected_on, by design, so no branch is proposed), so a branching switch would not isolate it; router: the router (evolve/router.py) is wired into no run path (build_router / Router.route are called only in tests) and is measured only by router.finalize_routed on the sealed split, a one-shot human-run command (invariant 6) that an ablation run must never consume'
- id: harnessx
