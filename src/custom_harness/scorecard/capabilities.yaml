# Claimed capabilities (GOAL §9 coverage contract, transcribed row by row) and the ablation record of each
# (GOAL §2.1, invariant 12: every claimed capability has code, a test and an ablation). docs/ablation.md is the table.
# `ablation` is exactly one of:
#   {switch: NAME}                       a real switch in the closed registry custom_harness.ablation.SWITCHES (with
#                                        its code path and its test); `not_covered: {part: reason}` lists any part of
#                                        the row the switch does NOT turn off (then the row is a partial switch: a gap)
#   {not_ablatable: "exact reason"}      no switch: not built, or an integrity mechanism (never switched off in
#                                        production; measured only inside the evaluation harness)
# The scorecard counts a row as switched only for a full, registered, tested switch, and as ablated only once an
# ablation run (`scorecard.runner.run_ablation`) is recorded and compared; every other row is an invariant-12 gap.
capabilities:
- id: meta-harness
  source: Meta-Harness
  capability: Proposer with full history filesystem
  home: L6.1–2
  ablation:
    switch: proposer-history
- id: rhi
  source: RHI
  capability: Contracts and hops as edit types; compare to parent
  home: L6 edit types, race
  ablation:
    switch: contract-hop-edits
    not_covered:
      compare to parent: 'the paired comparison against the parent (evolve/selection.py race / paired_sample / gate) is the acceptance statistic, an integrity mechanism (invariant 6): no switch'
- id: rrsi
  source: RRSI
  capability: Leakage critic, regularised proposals/acceptance, cost-aware admission
  home: L6.5, L6.8, L6.10
  ablation:
    switch: cost-term
    not_covered:
      leakage critic: 'evolve/critic.py is an interface only: no working critic exists until a second model family is available (invariant 5 NOT MET) and its review is advisory (never gating)'
      regularised proposals: 'the annealed operator budget (evolve/generations.py AnnealSchedule) is applied in evolve/driver.py (CampaignLedger.begin), which receives no AblationSet: not switched'
      regularised acceptance: 'the regularised acceptance is the leave-one-family/domain-out non-regression gate (evolve/loop.py _lofo), an integrity gate (invariant 16): no switch'
- id: self-harness
  source: Self-Harness
  capability: Causal failure signatures, held-in/out non-regression, decline path
  home: L6.3, L6.6, gate
  ablation:
    switch: causal-signatures
    not_covered:
      held-in/out non-regression: 'the held-out gate and the leave-one-family/domain-out non-regression (evolve/selection.py gate, evolve/loop.py _lofo) are integrity gates (invariants 6, 16): no switch'
      decline path: 'the decline is part of the proposal schema (evolve/propose.py parse_proposal) and only records a `declined` lineage status: no switch built'
- id: autosaddler
  source: AutoSaddler
  capability: Deep diagnosis, patch taxonomy, mini-batch pre-filter, composition DAG
  home: L6.3, edit types, L6.8
  ablation:
    switch: minibatch-prefilter
    not_covered:
      deep diagnosis: the first-divergence diagnosis (evolve/diagnosis.py) is switched off by `causal-signatures`, which belongs to row self-harness (one row per switch)
      patch taxonomy: 'the typed edit taxonomy (evolve/edits.py EditType) is the only form an edit can take; removing it removes evolution itself, not one capability of it: no switch'
      composition DAG: not built (no edit composition exists in evolve/)
- id: milo
  source: MILO
  capability: Islands, lineage with rejects, adaptive orchestrator
  home: L7, ledger
  ablation:
    switch: orchestrator-reallocation
    not_covered:
      islands: control/islands.py islands are not wired to evolve/driver.py or any run path (only the Orchestrator's allocation over them exists); a single-population arm is not built
      lineage with rejects: 'the lineage records of rejected edits are the store''s append-only audit trail and the novelty gate''s input (switched by `novelty-gate`, row harnessx); dropping them would falsify the record: no switch'
      'adaptive orchestrator: lever choice and edit-type quota': the lever choice is switched by `lever-choice` (row sia); the prompt-only edit-type quota (Orchestrator.step cap, admit) is not switched
- id: mixture-of-branches
  source: Mixture of Branches
  capability: Coverage-based branching, router
  home: L6.9
  ablation:
    not_ablatable: 'branch creation (evolve/branches.propose_branch) never happens in ANY ablated generation (evolve/loop.py: an ablated arm has no rejected_on, so no branch is proposed), so a branching switch would not isolate it; the router (evolve/router.py) is measured only by router.finalize_routed on the sealed split, a one-shot human-run command (invariant 6) that an ablation run must never consume'
- id: harnessx
  source: HarnessX
  capability: Typed multi-dimension harness, deterministic gate, per-task attribution, novelty gate
  home: spec, gate, ledger
  ablation:
    switch: novelty-gate
    not_covered:
      typed multi-dimension harness: 'the typed HarnessSpec (runtime/spec.py) is the harness format itself: no switch'
      deterministic gate: 'the held-out gate (evolve/selection.py gate, evolve/loop.py _lofo) is an integrity mechanism (invariants 6, 16): no switch'
      per-task attribution: evolve/loop.py _per_task only writes ledger fields (per_task, flipped, regressed); no decision reads them, so switching it off changes no behaviour an ablation could measure
- id: adaptive-auto-harness
  source: Adaptive Auto-Harness
  capability: Branch tree, temporal reveal, solve-time routing, research logs
  home: L6.9, L6.11
  ablation:
    not_ablatable: 'branch tree: branch creation (evolve/branches.propose_branch) never happens in ANY ablated generation (evolve/loop.py: an ablated arm has no rejected_on, so no branch is proposed), so a branching switch would not isolate it; solve-time routing: the router (evolve/router.py) is measured only by router.finalize_routed on the sealed split, a one-shot human-run command (invariant 6) that an ablation run must never consume; temporal reveal (evolve/reveal.py): switching it off would reveal undated or future labels, a leak (invariants 2, 18): an integrity mechanism, no switch; research logs: not built as a decision input (evolve/generations.py generation reports are records only)'
- id: scholarevolve
  source: ScholarEvolve
  capability: Literature → mechanism → code mutation; bootstrap CI; topic quotas
  home: L4.3 → L6.2, gate, L4.4
  ablation:
    not_ablatable: 'literature -> mechanism -> code mutation: not built (no evolve/ code reads literature/); bootstrap CI: the paired statistics of the race and gate (evolve/selection.py) are an integrity mechanism (invariant 6); topic quotas: research/hypotheses.apply_topic_quota is not wired into the research loop (its own docstring), so no run path reaches it to switch'
- id: sol-pi
  source: SoL-Pi
  capability: Cost objective, ObservationPack, verified-quote reducer, frozen held-out
  home: L1, L4 context, gate
  ablation:
    switch: observation-pack
    not_covered:
      cost objective: 'the acceptance cost term is switched by `cost-term` (row rrsi); run and campaign budgets (budget.py) are fail-closed resource bounds: no switch'
      frozen held-out: 'the sealed split and never-shown gate are integrity mechanisms (invariant 6): no switch'
- id: continual-harness
  source: Continual Harness
  capability: Mid-episode refinement, adaptive cadence
  home: L6 (low-risk edit types, in-run only)
  ablation:
    not_ablatable: 'not built: no mid-episode (in-run) harness refinement and no adaptive edit cadence exist; evolution edits the harness only between runs (evolve/loop.py evolve_generation)'
