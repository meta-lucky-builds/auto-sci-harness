# Red-team findings registry (GOAL §16.6 invariant 19; schema from code_review/upgrade_review_2026-10-07/
# verify-the-verifier.md P3). Checked by `python scripts/museum.py --check-only` (part of `scripts/check.py --fast`):
# every test id must name an existing test function, every fixed finding needs a museum patch or a reason why none
# can exist, and every patch on disk must be referenced. `python scripts/museum.py` applies each patch in a scratch
# copy and requires at least one of the finding's tests to fail.
#
# capability = the weakest attacker that can mount it:
#   A0 model text, A1 evolved harness edit, A2 sandboxed program, A3 trusted host module that is buggy or mis-declares
#   a purpose, A4 store writer, A5 human operator.
# status: fixed (a fix is in the code) / open (not fixed) / accepted (a STATUS §D limitation; pinned by a strict xfail
# where a test can be written).
findings:
