# Two-node smoke harness: answer with a JSON contract, then a question-only critic (AHOIS-style).
id: smoke
entry: answer
nodes:
  answer:
    kind: llm
    prompt: "Answer the question. Return JSON {\"answer\": <string>, \"confidence\": <number 0-1>}.\nQuestion: {{input.q}}"
    output_key: answer
    output_schema:
      type: object
      properties:
        answer: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
      required: [answer, confidence]
    retries: 1
  critic:
    kind: llm
    role: critic
    prompt: "You are a Socratic critic. Do NOT give answers. Ask at most 2 short questions that would expose a flaw in this answer.\nQuestion: {{input.q}}\nAnswer: {{answer}}"
    output_key: critique
edges:
  - {source: answer, target: critic}
max_steps: 5
